# Release per Knopfdruck. Wird aus der App ausgelöst (Admin > Updates veröffentlichen)
# oder von Hand unter Actions > Release > Run workflow.
name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Was soll aktualisiert werden?"
        type: choice
        default: all
        options: [web, ios, android, mobile, all]
      submit:
        description: "App-Builds nach dem Build an TestFlight bzw. Google Play senden"
        type: boolean
        default: true

# Nur ein Release gleichzeitig
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Zählt die Build-Nummer einmal hoch, damit iOS und Android sie gemeinsam nutzen
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      build_number: ${{ steps.bump.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build-Nummer erhöhen
        id: bump
        if: inputs.target != 'web'
        run: node scripts/bump-build-number.mjs | tee bump.log && tail -n 1 bump.log >> "$GITHUB_OUTPUT"

      - name: Änderung committen
        id: commit
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore(release): Build ${{ steps.bump.outputs.build_number }}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web:
    needs: prepare
    if: contains(fromJSON('["web","all"]'), inputs.target)
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Webseite bauen
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_OPENWEATHER_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENWEATHER_API_KEY }}
        run: npx expo export --clear --platform web

      # Zum Herunterladen und für den Fall, dass kein Server hinterlegt ist
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          include-hidden-files: true
          retention-days: 14

      # Nur wenn ein Webhosting hinterlegt ist (DEPLOY_HOST).
      # Die Dateien werden über SSH entpackt, vorhandene Dateien werden überschrieben.
      - name: Auf dem Webhosting aktualisieren
        if: ${{ env.DEPLOY_HOST != '' }}
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Ohne genauen Zielordner nichts hochladen. Auf einem Webspace mit mehreren Seiten
          # würde der Hauptordner die Startseiten der anderen Seiten überschreiben.
          case "$DEPLOY_PATH" in
            ""|"."|"/"|"~"|"public_html"|"public_html/")
              echo "DEPLOY_PATH muss der Ordner dieser Domain sein, zum Beispiel public_html/ausflugfinder.ch" >&2
              exit 1
              ;;
          esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          tar -C dist -czf - . | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"

  ios:
    needs: prepare
    if: contains(fromJSON('["ios","mobile","all"]'), inputs.target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Der Build läuft bei Expo. Der Workflow stellt ihn nur in die Warteschlange.
      - name: iOS-Build starten
        run: eas build --platform ios --profile production --non-interactive --no-wait ${{ inputs.submit && '--auto-submit' || '' }}

  android:
    needs: prepare
    if: contains(fromJSON('["android","mobile","all"]'), inputs.target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Android-Build starten
        run: eas build --platform android --profile production --non-interactive --no-wait ${{ inputs.submit && '--auto-submit' || '' }}
