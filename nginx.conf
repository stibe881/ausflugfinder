# Serves the static web export (npx expo export --platform web).
# Expo writes one HTML file per route, so dynamic routes such as /trip/123
# have to be mapped to their template file (/trip/[id].html) by hand.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build output never changes
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Dynamic routes (order matters: first matching regex wins)
    location ~ ^/trip/edit/[^/]+$ { try_files /trip/edit/[id].html =404; }
    location ~ ^/trip/[^/]+$      { try_files $uri.html /trip/[id].html =404; }
    location ~ ^/plan/[^/]+$      { try_files $uri.html /plan/[id].html =404; }
    location ~ ^/planning/[^/]+$  { try_files $uri.html /planning/[id].html =404; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /+not-found.html;
}
